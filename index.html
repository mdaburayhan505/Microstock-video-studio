<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microstock Video Studio - Preview & Export</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1023;color:#fff;font-family:sans-serif;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:20px;color:#8ab4ff}
.free{background:#1e3a8a;padding:4px 10px;border-radius:8px;font-size:12px}
.box{background:#131a33;border:1px solid #26315c;border-radius:18px;padding:12px;margin:10px 0}
#frameWrap{background:#fff;border-radius:14px;overflow:hidden;width:100%;height:220px;display:block;position:relative}
#stage{width:100%;height:100%;border:0;background:#000;display:block}
#previewPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:14px;background:#fff;z-index:1}
textarea{width:100%;height:130px;background:#0a0f22;color:#cbd5e1;padding:12px;border:1px solid #26315c;border-radius:14px;font-size:13px;outline:none}
.btn{padding:11px 14px;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:12px;font-weight:bold}
.btn-main{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;padding:14px;font-size:17px;font-weight:900;border:none;border-radius:14px}
.btn-dl{width:100%;background:#00e676;color:#000;padding:14px;font-size:18px;font-weight:900;border:none;border-radius:12px;margin-top:10px;display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;padding:12px;background:#0a0f22;color:#fff;border:1px solid #334155;border-radius:12px;outline:none}
label{font-size:13px;color:#94a3b8;display:block;margin-bottom:4px}
.small{font-size:12px;color:#94a3b8}
#out{color:#4ade80;font-weight:bold}
</style>
</head>
<body>
<div class="top"><b>Microstock Video Studio</b><span class="free">FREE</span></div>
<p class="small"></p>

<!-- ১. প্রিভিউ সবার উপরে -->
<div class="box">
<div id="frameWrap">
<div id="previewPlaceholder">প্রিভিউ এখানে আসবে</div>
<iframe id="stage" sandbox="allow-scripts allow-same-origin" style="position:relative;z-index:2"></iframe></div>
<p id="msg" style="color:#a7f3d0">কোড পেস্ট করো, প্রিভিউ এখানে আসবে</p>
<p id="sizeShow" style="color:#facc15;font-weight:bold"></p>
</div>

<!-- ২. কোড -->
<div class="box">
<p>HTML কোড পেস্ট করো</p>
<textarea id="code" placeholder="এখানে HTML CODE পেস্ট করো..."></textarea>
<p id="cnt"></p>
<div style="display:flex;gap:8px">
<button class="btn" onclick="loadSample()">নমুনা</button>
<button class="btn" onclick="clearCode()">মুছুন</button>
</div>
<button class="btn-main" style="margin-top:10px" onclick="showPreview()">👁️ প্রিভিউ দেখুন</button>
</div>

<!-- ৩. তোমার পছন্দের সাইজ + এক্সপোর্ট -->
<div class="box">
<p style="font-weight:bold">৩. তোমার পছন্দের সাইজ বেছে নাও</p>
<div class="grid">
<div><label>সাইজ / রেজোলিউশন</label><select id="res" onchange="changeShape()">
<option value="1280x720">ল্যান্ডস্কেপ 720p - 1280x720</option>
<option value="1920x1080" selected>ল্যান্ডস্কেপ 1080p - 1920x1080</option>
<option value="720x1280">ভার্টিকাল 720p - 720x1280 (Reels / TikTok)</option>
<option value="1080x1920">ভার্টিকাল 1080p - 1080x1920</option>
<option value="1080x1080">স্কয়ার 1080 - 1080x1080 (FB / Insta)</option>
<option value="3840x2160">ল্যান্ডস্কেপ 4K - 3840x2160</option>
</select></div>
<div><label>ফ্রেমরেট (fps)</label><select id="fps"><option value="30" selected>30</option><option value="25">25</option><option value="24">24</option></select></div>
</div>
<div class="grid" style="margin-top:10px">
<div><label>সময় (সেকেন্ড)</label><input id="dur" value="10" type="number" min="1" max="30"></div>
<div><label>কোয়ালিটি</label><select id="quality"><option value="8000000" selected>হাই</option><option value="5000000">মাঝারি</option><option value="2500000">লো (ফোনের জন্য ভালো)</option></select></div>
</div>
<p class="small">প্রিভিউ পছন্দ হলে নিচের বাটনে চাপ দাও। যে সাইজ সিলেক্ট করবা, ঠিক ওই সাইজেই ভিডিও হবে।</p>
<button class="btn-main" id="exportBtn" onclick="doExport()">⬇ এই সাইজে MP4 এক্সপোর্ট করুন</button>
<p id="out"></p>
<button id="dlBtn" class="btn-dl">⬇ এখানে চাপ দিয়ে MP4 ডাউনলোড করো</button>
</div>

<canvas id="recCanvas" width="1280" height="720" style="display:none"></canvas>

<script>
let lastBlobUrl = null;

function getRes(){ var v=document.getElementById('res').value.split('x'); return {W:parseInt(v[0]), H:parseInt(v[1])}; }

function clearCode(){ document.getElementById('code').value=''; document.getElementById('cnt').innerText='কোড: 0 অক্ষর'; document.getElementById('stage').srcdoc=''; document.getElementById('previewPlaceholder').style.display='flex'; document.getElementById('msg').innerText='মুছে গেছে'; }

function loadSample(){
  document.getElementById('code').value='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0}html,body{width:100%;height:100%;overflow:hidden;background:#030713}.sun{width:140px;height:140px;background:#fff200;border-radius:50%;position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 80px 30px #fff200;animation:sun 3s ease-in-out infinite alternate}@keyframes sun{from{top:20%}to{top:45%}}.sea{position:absolute;bottom:0;width:100%;height:35%;background:linear-gradient(#00c6ff,#0072ff)}.title{position:absolute;top:62%;width:100%;text-align:center;color:white;font-size:32px;font-weight:bold}</style></head><body><div class="sun"></div><div class="sea"></div><div class="title">Sunset Beach</div></body></html>';
  showPreview();
}

function changeShape(){
  var r=getRes();
  var w=document.getElementById('frameWrap');
  if(r.H>r.W) w.style.height='380px';
  else if(r.W===r.H) w.style.height='320px';
  else w.style.height='220px';
  document.getElementById('sizeShow').innerText='📐 প্রিভিউ সাইজ: '+r.W+'x'+r.H+' - এই সাইজেই এক্সপোর্ট হবে';
  if(document.getElementById('code').value.length>10) showPreview();
}

function makeFullHtml(h){
  if(h.indexOf('<html')!==-1) return h;
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}</style></head><body>'+h+'</body></html>';
}

function showPreview(){
  var h=document.getElementById('code').value;
  if(!h || h.length<10){ document.getElementById('msg').innerText='⚠️ আগে কোড পেস্ট করো'; return; }
  document.getElementById('cnt').innerText='কোড: '+h.length+' অক্ষর';
  document.getElementById('previewPlaceholder').style.display='none';
  var r=getRes();
  var w=document.getElementById('frameWrap');
  if(r.H>r.W) w.style.height='380px';
  else if(r.W===r.H) w.style.height='320px';
  else w.style.height='220px';
  document.getElementById('sizeShow').innerText='📐 প্রিভিউ সাইজ: '+r.W+'x'+r.H+' - এই সাইজেই এক্সপোর্ট হবে';
  var iframe=document.getElementById('stage');
  iframe.srcdoc='';
  setTimeout(function(){ iframe.srcdoc=makeFullHtml(h); },30);
  document.getElementById('msg').innerText='';
}

async function doExport(){
  var h=document.getElementById('code').value;
  if(!h){ document.getElementById('out').innerText='⚠️ আগে কোড পেস্ট করো'; return; }
  var dur=parseInt(document.getElementById('dur').value)||10;
  var fps=parseInt(document.getElementById('fps').value)||30;
  var bitrate=parseInt(document.getElementById('quality').value)||8000000;
  var r=getRes(); var W=r.W, H=r.H;
  var btn=document.getElementById('exportBtn');
  btn.disabled=true; btn.innerText='⏳ '+W+'x'+H+' সাইজে MP4 বানানো হচ্ছে...';
  document.getElementById('dlBtn').style.display='none';
  document.getElementById('out').innerText='🎬 রেকর্ড হচ্ছে '+W+'x'+H+' ... স্ক্রল করবা না';
  showPreview();
  await new Promise(function(res){setTimeout(res,1200)});
  var iframe=document.getElementById('stage');
  var doc=null;
  try{ doc=iframe.contentDocument; }catch(e){}
  if(!doc || !doc.body){ document.getElementById('out').innerText='⚠️ প্রিভিউ লোড হয় নাই, আবার প্রিভিউ দেখুন চাপ দাও'; btn.disabled=false; return; }
  var canvas=document.getElementById('recCanvas');
  canvas.width=W; canvas.height=H;
  var ctx=canvas.getContext('2d');
  var userCanvas=doc.querySelector('canvas');
  var stream=null; var useDirectCanvas=false;
  if(userCanvas && userCanvas.captureStream){ try{ stream=userCanvas.captureStream(fps); useDirectCanvas=true; }catch(e){} }
  if(!useDirectCanvas){ stream=canvas.captureStream(fps); }
  var mime='video/mp4'; var rec;
  try{
    if(typeof MediaRecorder!=='undefined' && !MediaRecorder.isTypeSupported('video/mp4')) mime='video/webm;codecs=vp9';
    rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:bitrate});
  }catch(e){ rec=new MediaRecorder(stream); }
  var chunks=[];
  rec.ondataavailable=function(e){ if(e.data.size>0) chunks.push(e.data); };
  rec.onstop=function(){
    var blob=new Blob(chunks,{type:'video/mp4'});
    if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl=URL.createObjectURL(blob);
    document.getElementById('out').innerText='✅ MP4 রেডি! সাইজ: '+W+'x'+H+' | ফাইল: '+(blob.size/1024/1024).toFixed(2)+' MB | নিচের সবুজ বাটনে চাপ দাও';
    var dl=document.getElementById('dlBtn');
    dl.style.display='block';
    dl.onclick=function(){ var a=document.createElement('a'); a.href=lastBlobUrl; a.download='video-'+W+'x'+H+'-'+Date.now()+'.mp4'; a.click(); };
    btn.disabled=false; btn.innerText='⬇ এই সাইজে MP4 এক্সপোর্ট করুন';
  };
  rec.start();
  setTimeout(function(){ if(rec.state!=='inactive'){ try{rec.stop();}catch(e){} } }, dur*1000+2000);
  var start=performance.now(); var frame=0; var total=dur*fps;
  async function loop(){
    var elapsed=performance.now()-start;
    if(elapsed>=dur*1000){ if(rec.state!=='inactive') rec.stop(); return; }
    if(!useDirectCanvas){
      try{
        var scale=W / Math.max(1, doc.body.clientWidth);
        if(scale>1) scale=1;
        var shot=await html2canvas(doc.body,{backgroundColor:'#000000',scale:scale,useCORS:true,logging:false});
        ctx.drawImage(shot,0,0,W,H);
        frame++;
      }catch(e){ frame++; }
    } else { frame++; }
    setTimeout(loop, 1000/fps);
  }
  loop();
}

document.getElementById('code').addEventListener('input',function(){
  document.getElementById('cnt').innerText='কোড: '+this.value.length+' অক্ষর';
});
changeShape();
</script>
</body>
</html>
