<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
Microstock Video Studio
</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>
<style>
* {
box-sizing: border-box;
}
html, body {
overflow-x: hidden;
}
body {
margin: 0;
background: #0b1023;
color: #fff;
font-family: sans-serif;
padding: 10px;
}
.top {
display: flex;
justify-content: space-between;
align-items: center;
}
.top b {
font-size: 20px;
color: #8ab4ff;
}
.free {
background: #1e3a8a;
padding: 4px 10px;
border-radius: 8px;
font-size: 12px;
}
.box {
background: #131a33;
border: 1px solid #26315c;
border-radius: 18px;
padding: 12px;
margin: 10px 0;
}
#frameWrap {
background: #000;
border-radius: 14px;
overflow: hidden;
width: 100%;
height: 220px;
display: block;
position: relative;
}
#stage {
width: 100%;
height: 100%;
border: 0;
background: #000;
display: block;
touch-action: pan-y;
}
#previewPlaceholder {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
color: #333;
font-size: 14px;
background: #fff;
z-index: 1;
}
textarea {
width: 100%;
height: 130px;
background: #0a0f22;
color: #cbd5e1;
padding: 12px;
border: 1px solid #26315c;
border-radius: 14px;
font-size: 13px;
outline: none;
}
.btn {
padding: 11px 14px;
background: #1e293b;
color: #fff;
border: 1px solid #334155;
border-radius: 12px;
font-weight: bold;
}
.btn-main {
width: 100%;
background: linear-gradient(90deg,#3b82f6,#8b5cf6);
color: #fff;
padding: 14px;
font-size: 17px;
font-weight: 900;
border: none;
border-radius: 14px;
}
.btn-dl {
width: 100%;
background: #00e676;
color: #000;
padding: 14px;
font-size: 18px;
font-weight: 900;
border: none;
border-radius: 12px;
margin-top: 10px;
display: none;
}
.grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
select,
input {
width: 100%;
padding: 12px;
background: #0a0f22;
color: #fff;
border: 1px solid #334155;
border-radius: 12px;
outline: none;
}
label {
font-size: 13px;
color: #94a3b8;
display: block;
margin-bottom: 4px;
}
.small {
font-size: 12px;
color: #94a3b8;
}
#out {
color: #4ade80;
font-weight: bold;
}
#progWrap {
width: 100%;
height: 18px;
background: #0a0f22;
border: 1px solid #334155;
border-radius: 20px;
overflow: hidden;
margin-top: 10px;
display: none;
}
#progBar {
height: 100%;
width: 0%;
background: linear-gradient(90deg,#00e676,#3b82f6);
text-align: center;
font-size: 11px;
line-height: 18px;
color: #000;
font-weight: bold;
}
</style>
</head>
<body>
<div class="top">
<b>
Video Studio
</b>
<span class="free">
FREE
</span>
</div>
<div class="box">
<div id="frameWrap">
<div id="previewPlaceholder">
প্রিভিউ এখানে আসবে
</div>
<iframe id="stage" sandbox="allow-scripts allow-same-origin">
</iframe>
</div>
<p id="msg" style="color:#a7f3d0">
কোড পেস্ট করো, প্রিভিউ এখানে আসবে
</p>
</div>
<div class="box">
<p>
HTML কোড পেস্ট করো
</p>
<textarea id="code" placeholder="এখানে HTML CODE পেস্ট করো...">
</textarea>
<p id="cnt">
</p>
<div style="display:flex;gap:8px">
<button class="btn" onclick="loadSample()">
নমুনা
</button>
