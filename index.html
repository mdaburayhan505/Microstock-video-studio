<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microstock - Super Fast</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0;padding:10px}
.box{max-width:700px;margin:auto;background:#1e1e1e;padding:14px;border-radius:12px}
textarea{width:100%;height:80px;background:#000;color:#0f0;border-radius:8px;padding:8px}
button{background:#333;color:#fff;border:none;padding:9px 12px;border-radius:8px;margin:3px 2px}
select{background:#000;color:#fff;padding:7px;border-radius:7px}
#frame{width:100%;height:280px;background:#fff;border:none;border-radius:10px;display:none}
#bar{height:8px;background:#333;border-radius:10px;overflow:hidden;margin:8px 0}
#fill{height:8px;background:#ffcc00;width:0%}
</style>
</head>
<body>
<div class="box">
<h3 style="margin:0">🎬 Microstock Studio - Super Fast</h3>
<p style="font-size:13px;color:#aaa">Lite Mode | ফোন স্লো হবে না</p>
<textarea id="code" placeholder="এখানে HTML কোড পেস্ট করো..."></textarea><br>
<button onclick="saveOnly()">💾 শুধু সেভ</button>
<button onclick="showPreview()" style="background:#ffcc00;color:#000;font-weight:bold">👁️ প্রিভিউ দেখো</button>
<button onclick="hidePreview()">❌ প্রিভিউ বন্ধ</button>
<button onclick="sample()">🎬 স্যাম্পল</button>
<p id="info">কোনো ভিডিও নাই</p>
<select id="res"><option>4K</option><option>1080p</option></select>
<select id="dur"><option>10</option><option>15</option><option>30</option></select>
<div id="bar"><div id="fill"></div></div>
<p id="time">0s / 10s</p>
<button onclick="play()">▶️ Play</button>
<button onclick="stop()">⏸️ Stop</button>
<iframe id="frame" loading="lazy"></iframe><br>
<button onclick="exportIt()" style="background:#00e676;color:#000;width:100%;font-weight:bold">📤 Export</button>
<p id="out"></p>
</div>
<script>
let t=null,sec=0,myTitle="video";
function getTitle(h){let m=h.match(/<title>(.*?)<\/title>/i);return m?m[1]:"video"}
function saveOnly(){let h=document.getElementById('code').value;if(!h){alert('আগে কোড পেস্ট করো');return}myTitle=getTitle(h);document.getElementById('info').textContent="সেভ হয়েছে: "+myTitle}
function showPreview(){let h=document.getElementById('code').value;if(!h){alert('আগে কোড পেস্ট করো');return}saveOnly();let f=document.getElementById('frame');f.style.display='block';f.srcdoc=h}
function hidePreview(){let f=document.getElementById('frame');f.style.display='none';f.removeAttribute('srcdoc');f.src='about:blank';stop()}
function sample(){document.getElementById('code').value='<!DOCTYPE html><html><head><title>Sunset Beach</title></head><body style="background:orange;text-align:center;padding:40px"><h1>Sunset Beach</h1></body></html>';saveOnly()}
function play(){stop();sec=0;let dur=parseInt(document.getElementById('dur').value);t=setInterval(()=>{sec+=0.5;if(sec>=dur){stop();sec=dur}document.getElementById('fill').style.width=(sec/dur*100)+'%';document.getElementById('time').textContent=sec.toFixed(1)+'s / '+dur+'s'},500)}
function stop(){if(t)clearInterval(t);t=null}
function exportIt(){saveOnly();let d=new Date().toISOString().slice(0,10);let name=myTitle.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'_'+d+'.html';document.getElementById('out').textContent='✅ রেডি: '+name;let b=new Blob([document.getElementById('code').value],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
</script>
</body>
</html>
