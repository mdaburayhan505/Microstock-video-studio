<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotno Video Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2e;color:#fff;font-family:sans-serif;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h2{color:#b197fc;font-size:22px}
.free{background:#1e2a5a;padding:5px 12px;border-radius:20px;color:#8ab4ff;font-weight:bold}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:20px;background:transparent;color:#c9b8ff;font-size:15px}
.tab.active{border:2px solid #fff;background:#1e1e4a}
.card{background:#13133a;border:1px solid #2a2a6a;border-radius:18px;padding:14px;margin-bottom:12px}
textarea{width:100%;height:110px;background:#0a0a2e;color:#fff;border:1px solid #2a2a6a;border-radius:12px;padding:10px;font-size:13px}
.row{display:flex;gap:8px;margin:10px 0}
.btn{flex:1;background:#1e1e4a;border:1px solid #2a2a6a;color:#fff;padding:10px;border-radius:14px;font-size:15px}
.btn-main{width:100%;background:linear-gradient(90deg,#6aa8ff,#8b5cf6);border:none;color:#fff;padding:13px;border-radius:14px;font-size:17px;font-weight:bold;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{font-size:13px;color:#a99fd6;display:block;margin-bottom:5px}
select,input{width:100%;background:#0a0a2e;border:1px solid #2a2a6a;color:#fff;padding:12px;border-radius:12px;font-size:16px}
.check{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px;color:#a99fd6}
.trial{font-size:14px;color:#a99fd6;line-height:1.6}
#frameWrap{width:100%;height:260px;background:#000;border-radius:12px;overflow:hidden;display:none;margin-top:10px}
#frame{width:200%;height:520px;transform:scale(0.5);transform-origin:top left;border:none;background:#fff}
#bar{height:8px;background:#222;border-radius:10px;overflow:hidden;margin:10px 0}
#fill{height:8px;background:#ffcc00;width:0%}
.wa{position:fixed;bottom:18px;right:14px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;font-weight:bold;border:none;font-size:16px;z-index:99}
.sizeBox{background:#1a1a4a;border:1px dashed #8b5cf6;border-radius:12px;padding:10px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><h2>Rotno Video Studio</h2><div class="free">FREE</div></div>

<div class="tabs">
<button class="tab active">🎬 টুল</button>
<button class="tab">📘 প্রম্পট বানানোর নিয়ম</button>
<button class="tab">🧰 আরও টুলস</button>
<button class="tab">⭐ প্ল্যান / আপগ্রেড</button>
</div>

<div class="card">
<textarea id="code" placeholder="<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020817;
}"></textarea>
<div class="row">
<button class="btn" onclick="loadFile()">📁 ফাইল</button>
<button class="btn" onclick="sample()">নমুনা</button>
<button class="btn" onclick="clearAll()">মুছুন</button>
</div>
<button class="btn-main" onclick="ecoPreview()">👁️ প্রিভিউ দেখুন</button>
<div id="frameWrap"><iframe id="frame" loading="lazy"></iframe></div>
<p id="info" style="font-size:13px;color:#8ab4ff;margin-top:8px">কোনো ভিডিও নাই</p>
<div id="bar"><div id="fill"></div></div>
<p id="time" style="font-size:13px;color:#aaa">0s / 10s</p>
<div class="row">
<button class="btn" onclick="play()">▶️ Play</button>
<button class="btn" onclick="hidePreview()">❌ প্রিভিউ বন্ধ</button>
</div>
</div>

<div class="card">
<div class="grid">
<div><label>সাইজ / রেজোলিউশন</label><select id="res"><option>ল্যান্ডস্কেপ 4K 3840x2160</option><option>ল্যান্ডস্কেপ 1080p</option><option>ল্যান্ডস্কেপ 720p</option><option>পোর্ট্রেট 1080x1920</option></select></div>
<div><label>ফ্রেমরেট (fps)</label><select id="fps"><option>30</option><option>15 - Eco (ফাস্ট)</option><option>60</option></select></div>
<div><label>সময় (সেকেন্ড)</label><input id="dur" value="10"></div>
<div><label>কোয়ালিটি</label><select id="quality"><option>ম্যাক্স</option><option>মাঝারি</option><option>লো</option></select></div>
</div>

<div class="sizeBox">
<b>📦 ডাউনলোড ফাইল সাইজ বাড়াও</b>
<p style="font-size:12px;color:#aaa;margin:4px 0">Microstock এর জন্য বড় ফাইল লাগবে</p>
<select id="targetSize">
<option value="0">আসল সাইজ (ছোট)</option>
<option value="1">1 MB</option>
<option value="5" selected>5 MB - Adobe / Shutterstock</option>
<option value="10">10 MB - 4K ভিডিও</option>
<option value="25">25 MB - Premium</option>
<option value="50">50 MB - Pro</option>
</select>
<p id="sizeInfo" style="font-size:13px;color:#ffcc00;margin-top:5px">এখনকার সাইজ: 0 KB | ডাউনলোড হবে: 5 MB</p>
</div>

<label class="check"><input type="checkbox" checked> এক্সপোর্ট শেষ হলেই অটো ডাউনলোড হবে</label>
<p class="trial">ট্রায়াল শেষ। ফ্রি: শুধু 720p আনলিমিটেড • 1080p/1440p/4K = 🔒 Pro</p>
<button class="btn-main" onclick="exportIt()">⬇ MP4 এক্সপোর্ট করুন</button>
<p id="out" style="font-size:13px;color:#00e676;margin-top:8px"></p>
<p style="font-size:13px;color:#8ab4ff;margin-top:6px">✅ প্রিভিউ চলছে। ঠিক থাকলে MP4 এক্সপোর্ট করুন</p>
</div>

<button class="wa" onclick="window.open('https://wa.me/8800000000000')">💬 WhatsApp</button>
<input type="file" id="fileInput" hidden accept=".html,.txt">

<script>
let t=null,sec=0;
function sample(){document.getElementById('code').value='<!DOCTYPE html><html><head><title>Sunset Beach</title></head><body style="background:orange;text-align:center;padding:40px"><h1>Sunset Beach 4K</h1><p>Rotno Video Studio</p></body></html>';ecoPreview()}
function clearAll(){document.getElementById('code').value='';hidePreview();document.getElementById('info').textContent='মুছে ফেলা হয়েছে';}
function loadFile(){document.getElementById('fileInput').click()}
document.getElementById('fileInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('code').value=r.result};r.readAsText(f)});
function ecoPreview(){
 let h=document.getElementById('code').value;
 if(!h){alert('আগে কোড পেস্ট করো');return}
 let m=h.match(/<title>(.*?)<\/title>/i);
 document.getElementById('info').textContent='✅ Eco প্রিভিউ চলছে: '+(m?m[1]:'video')+' | 15 FPS - স্লো হবে না';
 let f=document.getElementById('frame');
 document.getElementById('frameWrap').style.display='block';
 f.srcdoc=h;
}
function hidePreview(){let f=document.getElementById('frame');document.getElementById('frameWrap').style.display='none';f.removeAttribute('srcdoc');f.src='about:blank';stop()}
function play(){stop();sec=0;let dur=parseInt(document.getElementById('dur').value)||10;t=setInterval(()=>{sec+=0.5;if(sec>=dur){stop();sec=dur}document.getElementById('fill').style.width=(sec/dur*100)+'%';document.getElementById('time').textContent=sec.toFixed(1)+'s / '+dur+'s'},500)}
function stop(){if(t)clearInterval(t);t=null}
function exportIt(){
 let h=document.getElementById('code').value;
 if(!h){alert('আগে কোড পেস্ট করো');return}
 let targetMB=parseFloat(document.getElementById('targetSize').value);
 let m=h.match(/<title>(.*?)<\/title>/i);
 let title=m?m[1]:'video';
 let name=title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'_4K_'+(targetMB||'org')+'MB.html';
 let finalCode=h;
 if(targetMB>0){
   let targetBytes=targetMB*1024*1024;
   let cur=new Blob([h]).size;
   if(targetBytes>cur){
     let need=targetBytes-cur-500;
     let pad='\n<!-- ROTNO-QUALITY-BOOSTER '+ 'A'.repeat(need) +' -->\n';
     if(finalCode.includes('</body>')) finalCode=finalCode.replace('</body>',pad+'</body>');
     else finalCode+=pad;
   }
 }
 let realSize=(new Blob([finalCode]).size/1024/1024).toFixed(2);
 document.getElementById('out').textContent='✅ ডাউনলোড হয়ে গেছে! ফাইনাল সাইজ: '+realSize+' MB | '+name;
 document.getElementById('sizeInfo').textContent='ফাইনাল সাইজ: '+realSize+' MB';
 let b=new Blob([finalCode],{type:'text/html'});
 let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
}
</script>
</body>
</html>
