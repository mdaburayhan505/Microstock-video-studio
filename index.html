<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#7dd3fc;font-size:24px}
.free{background:#2563eb;padding:4px 10px;border-radius:20px;font-size:12px}
.steps{font-size:13px;opacity:.8;margin:8px 0 12px}
#frameWrap{background:#fff;border-radius:14px;overflow:hidden;width:100%;height:220px;display:block;position:relative}
#previewPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:15px;background:#fff;z-index:1}
#stage{width:100%;height:100%;border:0;background:#000;position:relative;z-index:2}
.note{margin:10px 0;font-size:14px}
.note b{color:#facc15}
.card{background:#1e293b;border-radius:14px;padding:14px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:17px}
textarea{width:100%;height:160px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font-size:13px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.previewBtn{background:#2563eb;color:#fff}
.clearBtn{background:#334155;color:#fff}
select{width:100%;padding:12px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #334155;margin-top:10px}
.exportBtn{background:#22c55e;color:#fff}
</style>
</head>
<body>

<div class="top"><h2>Video Studio</h2><span class="free">FREE</span></div>
<div class="steps">১. কোড দাও -> ২. প্রিভিউ দেখো -> ৩. সাইজ বেছে এক্সপোর্ট করো</div>

<div id="frameWrap">
<div id="previewPlaceholder">প্রিভিউ এখানে আসবে</div>
<iframe id="stage" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<div class="note">কোড পেস্ট করো, প্রিভিউ এখানে আসবে<br>⚠️ <b>প্রিভিউ সাইজ: 1920x1080 - এই সাইজেই এক্সপোর্ট হবে</b></div>

<div class="card">
<h3>HTML কোড পেস্ট করো</h3>
<textarea id="codeInput" placeholder="এখানে HTML কোড পেস্ট করো..."></textarea>
<div id="count">কোড: 0 অক্ষর</div>
<button class="btn previewBtn" onclick="showPreview()">👁️ প্রিভিউ দেখুন</button>
<button class="btn clearBtn" onclick="clearCode()">🗑️ মুছে ফেলো</button>
<select id="sizeSelect">
<option value="1920x1080">1920x1080 - Full HD</option>
<option value="1280x720">1280x720 - HD</option>
<option value="1080x1080">1080x1080 - Square</option>
<option value="1080x1920">1080x1920 - Reels / Shorts</option>
</select>
<button class="btn exportBtn" onclick="exportCode()">⬇️ এক্সপোর্ট করো</button>
</div>

<script>
var codeInput=document.getElementById('codeInput');
codeInput.addEventListener('input',function(){
document.getElementById('count').textContent='কোড: '+codeInput.value.length+' অক্ষর';
});

function showPreview(){
var code=codeInput.value.trim();
if(!code){alert('আগে কোড পেস্ট করো');return;}
document.getElementById('previewPlaceholder').style.display='none';
// কোডে <html> না থাকলেও যাতে চলে, পুরা পেজ বানিয়ে দেওয়া
var fullCode=code;
if(code.indexOf('<html')===-1){
fullCode='<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style></head><body>'+code+'</body></html>';
}
var iframe=document.getElementById('stage');
iframe.srcdoc=fullCode;
// প্লে নিশ্চিত করতে আবার লোড
setTimeout(function(){ iframe.srcdoc=fullCode; },50);
}

function clearCode(){
codeInput.value='';
document.getElementById('count').textContent='কোড: 0 অক্ষর';
document.getElementById('previewPlaceholder').style.display='flex';
document.getElementById('stage').srcdoc='';
}

function exportCode(){
var code=codeInput.value.trim();
if(!code){alert('আগে কোড পেস্ট করো');return;}
var blob=new Blob([code],{type:'text/html'});
var a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='video-'+document.getElementById('sizeSelect').value+'.html';
a.click();
}
</script>
</body>
</html>
