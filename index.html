<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotno Video Studio - Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;
 background:#0b1023;color:white;
 font-family:Arial,sans-serif;
}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:21px;color:#8ab4ff}
.free{background:#1e3a8a;padding:6px 12px;border-radius:10px;font-size:12px}
.pill{background:#1e293b;padding:7px 12px;border-radius:20px;font-size:12px;display:inline-block;margin:4px 2px}
.box{background:#131a33;border:1px solid #26315c;border-radius:16px;padding:13px;margin:12px 0}
.small{font-size:12px;color:#94a3b8;line-height:1.6}
#frameWrap{
 position:relative;width:100%;height:220px;
 overflow:hidden;background:#000;
 border-radius:12px;display:none;
}
#stage{
 position:absolute;top:0;left:0;
 border:0;transform-origin:top left;
 background:#000;
}
textarea{
 width:100%;height:145px;
 background:#080e20;color:#cbd5e1;
 border:1px solid #334155;border-radius:12px;
 padding:12px;font-size:12px;outline:none;
}
.btn{
 padding:11px 13px;background:#1e293b;color:white;
 border:1px solid #334155;border-radius:10px;
 font-weight:bold;
}
.btn-main{
 width:100%;padding:14px;
 background:linear-gradient(90deg,#2563eb,#9333ea);
 color:white;border:0;border-radius:12px;
 font-size:16px;font-weight:bold;
}
.btn:disabled,.btn-main:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input:not([type=checkbox]):not([type=file]){
 width:100%;padding:12px;
 background:#080e20;color:white;
 border:1px solid #334155;border-radius:10px;
}
label{font-size:12px;color:#94a3b8;display:block;margin-bottom:5px}
#out{font-size:13px;color:#4ade80;line-height:1.6}
#fill{height:100%;background:#facc15;width:0%}
.progress{height:8px;background:#334155;border-radius:10px;overflow:hidden}
#time{color:#facc15}
#frameInfo{font-size:11px;color:#94a3b8}
</style>
</head>

<body>

<div class="top">
<b>Rotno Video Studio</b>
<span class="free">FREE PRO</span>
</div>

<div style="margin-top:10px">
<span class="pill">🎬 Video Studio</span>
<span class="pill">📁 HTML Renderer</span>
<span class="pill">⭐ Export Tool</span>
</div>

<p class="small">
HTML Animation থেকে ভিডিও রেকর্ড করো।
720p, Full HD, 4K এবং Vertical Video Export।
</p>

<div class="box">
<h3>🎥 Live Preview</h3>

<div id="frameWrap">
<iframe id="stage" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<p id="msg" class="small">প্রথমে HTML কোড পেস্ট করো।</p>

<p>
<span id="time">0.0s</span>
<span id="frameInfo"></span>
</p>

<div class="progress">
<div id="fill"></div>
</div>
</div>

<div class="box">
<h3>📄 HTML Code</h3>

<textarea id="code" placeholder="এখানে সম্পূর্ণ HTML কোড পেস্ট করো..."></textarea>

<p class="small" id="cnt">কোড: 0 অক্ষর</p>

<div class="grid">
<button class="btn" onclick="document.getElementById('file').click()">📁 HTML ফাইল</button>
<button class="btn" onclick="loadSample()">নমুনা কোড</button>
</div>

<input type="file" id="file" accept=".html,.htm,text/html" hidden>

<button class="btn" style="margin-top:10px" onclick="clearCode()">🗑 মুছুন</button>

<button class="btn-main" style="margin-top:10px" onclick="showPreview()">👁 Preview দেখুন</button>
</div>

<div class="box">
<h3>⚙️ Export Settings</h3>

<div class="grid">
<div>
<label>ভিডিও রেজোলিউশন</label>
<select id="res" onchange="changeShape()">
<option value="1280x720">720p HD</option>
<option value="1920x1080" selected>1080p Full HD</option>
<option value="3840x2160">4K Ultra HD</option>
<option value="720x1280">Vertical 720p</option>
<option value="1080x1920">Vertical Full HD</option>
<option value="1080x1080">Square 1080</option>
</select>
</div>

<div>
<label>Frame Rate</label>
<select id="fps">
<option value="24">24 FPS</option>
<option value="25">25 FPS</option>
<option value="30" selected>30 FPS</option>
</select>
</div>

<div>
<label>Duration (Seconds)</label>
<input id="dur" type="number" value="10" min="1" max="60">
</div>

<div>
<label>Video Quality</label>
<select id="quality">
<option value="4000000">Low</option>
<option value="8000000" selected>Medium</option>
<option value="12000000">High</option>
<option value="20000000">Ultra</option>
</select>
</div>
</div>

<p class="small">
<input type="checkbox" id="autoDL" checked>
Export শেষ হলে অটো ডাউনলোড
</p>

<button class="btn-main" id="exportBtn" onclick="doExport()">
⬇ ভিডিও তৈরি করুন
</button>

<p id="out"></p>
</div>

<canvas id="recCanvas" style="display:none"></canvas>

<script>
const $=id=>document.getElementById(id);

let recording=false;
let previewPromise=Promise.resolve();

function getRes(){
 let a=$('res').value.split('x');
 return {W:+a[0],H:+a[1]};
}

function makeFullHtml(h){
 if(/<html[\s>]/i.test(h)) return h;

 return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style></head><body>'+h+'</body></html>';
}

function changeShape(){
 const r=getRes();
 const wrap=$('frameWrap');
 const width=wrap.clientWidth||340;
 wrap.style.height=(width*r.H/r.W)+'px';

 const frame=$('stage');
 frame.style.width=r.W+'px';
 frame.style.height=r.H+'px';
 frame.style.transform='scale('+(width/r.W)+')';
}

function showPreview(){
 const h=$('code').value;

 if(!h.trim()){
  $('msg').innerText='⚠️ আগে HTML কোড পেস্ট করো';
  return;
 }

 $('cnt').innerText='কোড: '+h.length+' অক্ষর';
 $('frameWrap').style.display='block';

 const r=getRes();
 changeShape();

 const frame=$('stage');
 frame.style.width=r.W+'px';
 frame.style.height=r.H+'px';
 frame.style.transform='scale('+($('frameWrap').clientWidth/r.W)+')';

 $('msg').innerText='⏳ Preview Loading...';

 previewPromise=new Promise(resolve=>{
  frame.onload=()=>{
   $('msg').innerText='✅ Live Animation চলছে';
   resolve();
  };
  frame.srcdoc=makeFullHtml(h);
 });

 return previewPromise;
}

function clearCode(){
 if(recording)return;
 $('code').value='';
 $('cnt').innerText='কোড: 0 অক্ষর';
 $('frameWrap').style.display='none';
 $('stage').srcdoc='';
 $('msg').innerText='কোড মুছে ফেলা হয়েছে';
}

function loadSample(){
 $('code').value=`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
background:radial-gradient(circle at 50% 50%,#173b75,#020613);
}
.orb{
position:absolute;
width:250px;height:250px;
border-radius:50%;
left:50%;top:50%;
transform:translate(-50%,-50%);
background:radial-gradient(circle at 30% 25%,white,#00dfff 25%,#102e85 75%);
box-shadow:0 0 100px #00dfff;
animation:move 4s ease-in-out infinite alternate;
}
@keyframes move{
from{transform:translate(-50%,-50%) scale(.7) rotate(0deg)}
to{transform:translate(-50%,-50%) scale(1.5) rotate(180deg)}
}
</style>
</head>
<body><div class="orb"></div></body>
</html>`;
 $('cnt').innerText='কোড: '+$('code').value.length+' অক্ষর';
 showPreview();
}

$('file').addEventListener('change',async function(){
 const f=this.files[0];
 if(!f)return;
 $('code').value=await f.text();
 $('cnt').innerText='কোড: '+$('code').value.length+' অক্ষর';
 showPreview();
 this.value='';
});

$('code').addEventListener('input',function(){
 $('cnt').innerText='কোড: '+this.value.length+' অক্ষর';
});

window.addEventListener('resize',()=>{
 if($('frameWrap').style.display==='block')changeShape();
});

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

async function doExport(){

 if(recording)return;

 const h=$('code').value;
 if(!h.trim()){
  $('out').innerText='⚠️ আগে HTML কোড পেস্ট করো';
  return;
 }

 if(typeof html2canvas==='undefined'){
  $('out').innerText='⚠️ Internet চালু করে আবার চেষ্টা করো।';
  return;
 }

 const dur=Math.min(60,Math.max(1,Number($('dur').value)||10));
 const fps=Number($('fps').value)||30;
 const bitrate=Number($('quality').value)||8000000;
 const r=getRes();
 const W=r.W,H=r.H;
 const total=Math.ceil(dur*fps);

 const btn=$('exportBtn');
 recording=true;
 btn.disabled=true;
 btn.innerText='⏳ ভিডিও তৈরি হচ্ছে...';
 $('out').innerText='Preview প্রস্তুত হচ্ছে...';

 try{

  await showPreview();
  await sleep(800);

  const frame=$('stage');
  const doc=frame.contentDocument;

  if(!doc || !doc.body){
   throw new Error('HTML Preview লোড হয়নি');
  }

  const canvas=$('recCanvas');
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)throw new Error('Canvas তৈরি হয়নি');

  const stream=canvas.captureStream(fps);

  if(!stream)throw new Error('CaptureStream সমর্থিত নয়');

  const types=[
   'video/mp4',
   'video/webm;codecs=vp9',
   'video/webm;codecs=vp8',
   'video/webm'
  ];

  let mime='';
  for(const t of types){
   if(MediaRecorder.isTypeSupported(t)){
    mime=t;
    break;
   }
  }

  if(!mime)throw new Error('এই ব্রাউজারে Video Recorder সমর্থিত নয়');

  const ext=mime.includes('mp4')?'mp4':'webm';

  const recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:bitrate
  });

  const chunks=[];

  const stopped=new Promise((resolve,reject)=>{
   recorder.ondataavailable=e=>{
    if(e.data && e.data.size>0)chunks.push(e.data);
   };
   recorder.onstop=resolve;
   recorder.onerror=e=>reject(e.error||new Error('Recording Error'));
  });

  recorder.start(250);

  const start=performance.now();
  let frameNo=0;

  async function capture(){

   const elapsed=performance.now()-start;

   if(elapsed>=dur*1000)return;

   const shot=await html2canvas(doc.documentElement,{
    backgroundColor:'#000000',
    scale:W/Math.max(1,doc.documentElement.clientWidth),
    width:doc.documentElement.clientWidth,
    height:doc.documentElement.clientHeight,
    windowWidth:doc.documentElement.clientWidth,
    windowHeight:doc.documentElement.clientHeight,
    useCORS:true,
    logging:false
   });

   ctx.fillStyle='#000000';
   ctx.fillRect(0,0,W,H);
   ctx.drawImage(shot,0,0,W,H);

   if(frameNo===0){
    ctx.drawImage(shot,0,0,W,H);
   }

   frameNo++;

   const now=performance.now()-start;
   $('time').innerText=(now/1000).toFixed(1)+'s';
   $('fill').style.width=Math.min(100,now/(dur*1000)*100)+'%';

   $('frameInfo').innerText=
   ' Frame '+frameNo+'/'+total+
   ' | '+W+'x'+H+
   ' | '+fps+' FPS';

   if(now<dur*1000){
    await sleep(Math.max(0,(1000/fps)-(performance.now()-start-now)));
    await capture();
   }
  }

  await capture();

  if(recorder.state!=='inactive'){
   recorder.stop();
  }

  await stopped;
  stream.getTracks().forEach(t=>t.stop());

  const blob=new Blob(chunks,{type:mime});

  if(!blob.size)throw new Error('ভিডিও ফাইল তৈরি হয়নি');

  if($('autoDL').checked){
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url;
   a.download='rotno-video-'+Date.now()+'.'+ext;
   document.body.appendChild(a);
   a.click();
   a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
  }

  $('fill').style.width='100%';
  $('out').innerText=
   '✅ ভিডিও তৈরি হয়েছে!'+
   ' Format: '+ext.toUpperCase()+
   ' | Size: '+(blob.size/1024/1024).toFixed(2)+' MB'+
   ' | Resolution: '+W+'x'+H;

 }catch(e){
  $('out').innerText='❌ সমস্যা: '+(e.message||e);
  console.error(e);
 }finally{
  recording=false;
  btn.disabled=false;
  btn.innerText='⬇ ভিডিও তৈরি করুন';
 }
}

changeShape();
</script>
</body>
</html>
